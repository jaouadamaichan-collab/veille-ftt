name: Maintenance (import config, santé des sources, tests)

on:
  workflow_dispatch:
    inputs:
      action:
        description: Action à lancer
        type: choice
        options: [tests, import-config, import-config-maj-sources, sante-sources, activer-hypotheses-proposees, renvoyer-dernier-brief]
        default: tests
  push:
    branches: [main]
    paths: ['veille/**', 'config/**', 'tests/**', 'cockpit/**']

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Tests (toujours)
        run: python -m pytest -q
      - name: Import de la configuration
        if: github.event_name == 'workflow_dispatch' && startsWith(inputs.action, 'import-config')
        run: python -m veille.seed ${{ inputs.action == 'import-config-maj-sources' && '--maj-sources' || '' }}
      - name: Activer les hypothèses proposées (décision humaine)
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'activer-hypotheses-proposees'
        run: python -m veille.valider --activer-proposees --motif "Validées par l'analyste (déclenchement manuel ${{ github.actor }}, run ${{ github.run_id }})"
      - name: Renvoyer le dernier brief (test du mail et du lien cockpit)
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'renvoyer-dernier-brief'
        env:
          GMAIL_EXPEDITEUR:   ${{ secrets.GMAIL_EXPEDITEUR }}
          GMAIL_MOT_DE_PASSE: ${{ secrets.GMAIL_MOT_DE_PASSE }}
          GMAIL_DESTINATAIRE: ${{ secrets.GMAIL_DESTINATAIRE }}
          COCKPIT_URL:        ${{ vars.COCKPIT_URL }}
        run: python -m veille.envoyer_brief
      - name: Santé des flux RSS
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'sante-sources'
        run: python -m veille.check_sources
